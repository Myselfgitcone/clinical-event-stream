name: procedure
version: 1
resource_type: Procedure
key: procedure_id
fields:
  - {name: procedure_id,        type: string,   required: true, phi: other_unique_id, deid: pseudonym}
  - {name: patient_id,          type: string,   required: true, phi: other_unique_id, deid: pseudonym}
  - {name: encounter_id,        type: string,   phi: other_unique_id, deid: pseudonym}
  - {name: status,              type: string,   required: true, phi: none, deid: keep,
     enum: [preparation, in-progress, not-done, on-hold, stopped, completed, entered-in-error, unknown]}
  - {name: code_system,         type: string,   required: true, phi: none, deid: keep}
  - {name: code,                type: string,   required: true, phi: none, deid: keep}
  - {name: display,             type: string,   phi: none, deid: keep, free_text: true}
  - {name: performed_start,     type: datetime, required: true, phi: date, deid: shift}
  - {name: performed_end,       type: datetime, phi: date, deid: shift}
  - {name: reason_condition_id, type: string,   phi: other_unique_id, deid: pseudonym}
  - {name: location_name,       type: string,   phi: none, deid: keep, free_text: true}
rules:
  - {kind: not_future, field: performed_start}
  - {kind: not_before, field: performed_end, than: performed_start}
