name: site

# Redeploys the status page when only the page changed. The feeds are not
# regenerated: the two JSON files already published are fetched back so the
# page goes live in a minute instead of waiting for Monday's cohort.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the feeds already published
        run: |
          mkdir -p site/data
          curl --fail --silent --show-error "$BASE/data/summary.json" -o site/data/summary.json
          curl --fail --silent --show-error "$BASE/data/weekly.json"  -o site/data/weekly.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the feeds before publishing them again
        run: python scripts/check_feeds.py site/data/summary.json site/data/weekly.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
